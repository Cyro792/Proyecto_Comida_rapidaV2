server:
  port: 8081

spring:
  application:
    name: microservicio-inventario # <-- El nombre con el que aparecerás en el Eureka de tu amigo

  # Activación de Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Configuración de la conexión a la Base de Datos (Laragon)
  datasource:
    url: jdbc:mysql://localhost:3306/microservicio_inventario?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Configuración de Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Configuración para registrarse en el Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true