server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:

        - id: catalogo-service
          uri: lb://MS-CATALOGO
          predicates:
            - Path=/api/productos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/