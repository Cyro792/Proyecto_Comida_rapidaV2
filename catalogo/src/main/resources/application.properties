# 1. Configuracion del Servidor
spring.application.name=catalogo
server.port=8082

# 2. Conexion a la Base de Datos (Spring Boot la necesita para funcionar)
spring.datasource.url=jdbc:mysql://localhost:3306/db_catalogo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuracion de Hibernate (Para que no intente crear tablas por su cuenta)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true