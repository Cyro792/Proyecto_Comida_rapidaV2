server:
  port: 8082

spring:
  application:
    name: ms-catalogo
  datasource:
    url: jdbc:mysql://localhost:3306/db_catalogo
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/