version: '3.8'

networks:
  restaurante-network:
    external: true

services:

  db-pedidos:
    image: mysql:8.0
    container_name: db-pedidos
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_pedidos
    networks:
      - restaurante-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  ms-pedidos:
    build: .
    container_name: ms-pedidos
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-pedidos:3306/db_pedidos?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      COCINA_SERVICE_URL: http://ms-cocina:8082
      CATALOGO_SERVICE_URL: http://ms-catalogo:8083
    ports:
      - "8081:8081"
    depends_on:
      db-pedidos:
        condition: service_healthy
    networks:
      - restaurante-network
