server:
  port: 8082

spring:
  application:
    name: microservicio-pagos

  datasource:
    url: jdbc:mysql://localhost:3306/db_pagos?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:    # Pon aquí la contraseña de tu MySQL si usas una

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Configuración para que el microservicio se registre automáticamente en el servidor de Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true