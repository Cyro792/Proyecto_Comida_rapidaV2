server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  datasource:
    url: jdbc:mysql://localhost:3306/db_usuarios?useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/